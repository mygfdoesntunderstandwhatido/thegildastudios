name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by content-sync.yml after it merges main into a content branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cloudflare Workers names each branch preview after the branch, and refuses
  # a name that doesn't start and end with a letter or digit, or that has other
  # characters than - _ / . + =. A branch made in the admin with an empty name
  # is just `content-`, so its preview fails (#101). This says why, in words
  # editors can act on.
  branch-name:
    name: Branch name works for previews
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BRANCH" = "content-" ]; then
            echo "::error::This branch has no name after content-, so it can't get a preview. In the admin, start a new branch with a name such as spring-update, save your changes there, and close this pull request."
            exit 1
          fi
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9._/+=-]*[A-Za-z0-9])?$'; then
            echo "::error::The branch name \"$BRANCH\" can't get a preview. Use only letters, digits and dashes, and start and end with a letter or digit, such as content-spring-update. Start a new branch with a name like that and close this pull request."
            exit 1
          fi
          echo "Branch name \"$BRANCH\" is fine for a preview."

  build:
    name: Lint, type check and build
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: node --test scripts/contact.test.ts scripts/instagram.test.ts
      - run: npm run check
      - run: npm run build
      - run: npm run test:seo
      - run: npm run test:performance
      - run: npm run test:a11y
      - run: npm run lighthouse
      - name: Save Lighthouse reports and browser traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-reports
          path: |
            .lighthouseci/
            test-results/
          include-hidden-files: true
