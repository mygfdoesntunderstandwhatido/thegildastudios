# Netlify build settings. Node comes from .nvmrc (24).
# Deploy Previews (every PR) and branch deploys are switched on in the
# Netlify UI: Project configuration > Build & deploy > Continuous deployment.

[build]
  command = "npm run build"
  publish = "dist"
  # Only Keystatic content branches get branch deploys (see the script).
  ignore = "bash scripts/netlify-ignore.sh"

# Directory routes use one trailing slash; keep Netlify's native 404 handling.
[build.processing.html]
  pretty_urls = true

# Content hashes change whenever these generated assets change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font names are stable: cache for a week, without immutable so updates expire.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Revalidate HTML and stable-name metadata/artwork on every request.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
